<form (ngSubmit)="onSubmit()">
  <app-form-control label="Title">
    <input name="title" id="title" [(ngModel)]="title" />
  </app-form-control>
  <app-form-control label="Request">
    <textarea
      name="request"
      id="request"
      rows="3"
      [(ngModel)]="text"
    ></textarea>
  </app-form-control>
  <p>
    <button appButton>
      Submit
      <span ngProjectAs="icon"> ⌲ </span>
    </button>
  </p>
</form>
